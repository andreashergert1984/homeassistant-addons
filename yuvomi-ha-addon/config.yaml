---
name: Yuvomi Family Planner
version: "2.83.0"
slug: yuvomi
description: >-
  Self-hosted family planner: tasks, calendar, budget, meals, shopping, health
  and more in one PWA. Runs the unmodified upstream Yuvomi image.
url: https://github.com/ulsklyc/yuvomi
arch:
  - amd64
  - aarch64
startup: application
boot: auto

ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: Yuvomi web interface

ingress: true
ingress_port: 8099
panel_icon: mdi:barcode-scan
panel_title: Vorrat
# Also for non-admin users, e.g. a restricted account on the pantry wall phone.
panel_admin: false
webui: "[PROTO:ssl]://[HOST]:[PORT:3000]"
watchdog: "http://[HOST]:[PORT:3000]/health"

options:
  timezone: Europe/Berlin
  log_level: info
  # false: plain HTTP access (http://<ha-ip>:3000)
  # true: only behind an HTTPS reverse proxy, otherwise login cookies are dropped
  session_secure: false
  # 1 = one reverse proxy in front, loopback = direct access without proxy
  trust_proxy: loopback
  # API token of Yuvomi (Settings > Household > API access), scope pantry:write.
  api_token: ""
  # Look up unknown barcodes at Open Food Facts (sends the code to openfoodfacts.org)
  lookup_openfoodfacts: true
  weather_city: ""
  weather_lat: ""
  weather_lon: ""
  weather_units: metric

schema:
  timezone: str
  log_level: list(error|warn|info|debug)
  session_secure: bool
  trust_proxy: str
  api_token: password?
  lookup_openfoodfacts: bool
  weather_city: str?
  weather_lat: str?
  weather_lon: str?
  weather_units: list(metric|imperial)

map:
  - type: data
    read_only: false
  - type: share
    read_only: false
