configuration:
  run_times:
    name: Run times
    description: Times (HH:MM) at which the queue is processed. Claude is only started when something is queued.
  auto_draft:
    name: Draft new tickets right away
    description: New tickets from the todo list get a draft on the next run. Drafts change nothing.
  max_tickets_per_run:
    name: Tickets per run
    description: Upper limit per run, so the usage quota lasts.
  run_timeout_minutes:
    name: Time limit per ticket (minutes)
    description: The Claude call is stopped afterwards and the ticket is marked as failed.
  backup_before_change:
    name: HA backup before each implementation
    description: Partial Home Assistant backup without the database before each implementation, in addition to the file snapshots.
  intake_todo:
    name: Todo list for new tickets
    description: Items of this list become tickets and are removed from the list. Leave empty to turn it off.
  notify_service:
    name: Notification service
    description: "Optional, e.g. notify.mobile_app_phone. Reports drafts, questions, implementations and watch alarms."
  max_quota_percent:
    name: Quota limit (%)
    description: Above this utilization of the subscription (highest window reported by Claude Code) scheduled runs are skipped until the window resets. Immediate tickets still run. 0 turns it off.
  max_backup_gb:
    name: Limit for the HA backup (GB)
    description: If the config folder is larger (for example model files or media), no HA backup is made before an implementation, only the git snapshot of the configuration. A partial HA backup always contains the whole folder.
  inspection_day:
    name: Inspection
    description: On this day the first run looks around (read only) and fills the Suggestions tab. off, daily or a weekday (mon to sun). The German values aus, taeglich and mo to so still work.
  model:
    name: Model
    description: Optional, e.g. sonnet or opus. Empty uses the Claude Code default.
  language:
    name: Language
    description: Language of the board, the notifications and Claude's texts. auto follows the language of Home Assistant (German or English, otherwise English), de or en set it.
