configuration:
  run_times:
    name: Laufzeiten
    description: Uhrzeiten (HH:MM), zu denen der Hausmeister die Schlange abarbeitet. Steht nichts an, wird Claude nicht gestartet.
  auto_draft:
    name: Neue Tickets gleich entwerfen
    description: Neue Tickets aus der To-do-Liste bekommen beim nächsten Lauf einen Entwurf. Entwürfe ändern nichts.
  max_tickets_per_run:
    name: Tickets pro Lauf
    description: Höchstens so viele Tickets je Lauf, damit das Kontingent reicht.
  run_timeout_minutes:
    name: Zeitgrenze pro Ticket (Minuten)
    description: Danach wird der Claude-Aufruf abgebrochen und das Ticket als Fehler markiert.
  backup_before_change:
    name: HA-Sicherung vor jeder Umsetzung
    description: Teilsicherung von Home Assistant ohne Datenbank vor jeder Umsetzung, zusätzlich zur eigenen Dateisicherung.
  intake_todo:
    name: To-do-Liste für neue Tickets
    description: Einträge dieser Liste werden zu Tickets und aus der Liste entfernt. Leer lassen, um das auszuschalten.
  notify_service:
    name: Benachrichtigungsdienst
    description: "Optional, z. B. notify.mobile_app_handy. Meldet Entwürfe, Rückfragen, Umsetzungen und Wächter-Alarme."
  max_quota_percent:
    name: Kontingentgrenze (%)
    description: Ab dieser Auslastung des Abos (höchstes Fenster laut Claude Code) fallen geplante Läufe aus, bis das Fenster erneuert ist. Sofort-Tickets laufen trotzdem. 0 schaltet die Grenze aus.
  max_backup_gb:
    name: Grenze für die HA-Sicherung (GB)
    description: Ist der Konfigurationsordner größer (z. B. durch Modelle oder Medien), wird vor einer Umsetzung keine HA-Sicherung gemacht, nur die Git-Sicherung der Konfiguration. Eine HA-Teilsicherung enthält immer den ganzen Ordner.
  inspection_day:
    name: Rundgang
    description: An diesem Tag schaut sich Claude beim ersten Lauf nur lesend um und füllt den Reiter Vorschläge. off (aus), daily (täglich) oder ein Wochentag mon bis sun; die deutschen Werte aus, taeglich und mo bis so gelten weiter.
  model:
    name: Modell
    description: Optional, z. B. sonnet oder opus. Leer bedeutet die Vorgabe von Claude Code.
  language:
    name: Sprache
    description: Sprache von Board, Meldungen und Claudes Texten. auto folgt der Sprache von Home Assistant (Deutsch oder Englisch, sonst Englisch), de oder en legen sie fest.
